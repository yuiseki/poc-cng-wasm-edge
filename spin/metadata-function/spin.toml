#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "metadata-function"
version = "0.1.0"
authors = ["yuiseki <yuiseki@gmail.com>"]
description = "Lightweight CNG metadata endpoint — Phase 0 Wasm edge function experiment"

[[trigger.http]]
route = "/..."
component = "metadata-function"

[component.metadata-function]
source = "target/wasm32-wasip1/release/metadata_function.wasm"
allowed_outbound_hosts = [
  "https://raw.githubusercontent.com",
  "https://esa-worldcover.s3.eu-central-1.amazonaws.com",
]
[component.metadata-function.build]
command = "cargo build --target wasm32-wasip1 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
